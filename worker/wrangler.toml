# Brain Buddy nudge sender. Deploy: npx wrangler deploy (from this folder).
# Secret (never committed): npx wrangler secret put FIREBASE_SERVICE_ACCOUNT
name = "brain-buddy-nudge"
main = "src/index.js"
compatibility_date = "2026-09-01"

[vars]
FIREBASE_PROJECT_ID = "brain-buddy-ed84a"

# Daily squad clean-up at 03:00 UTC (08:00 in Pakistan): removes members inactive for 30 days.
[triggers]
crons = ["0 3 * * *"]
